:root{
  --bg:#ffffff; --ink:#151515; --muted:#66625c; --line:#e6e3df; --soft:#f5f4f2;

  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000000; --ink:#f2f2f2; --muted:#9a968f; --line:#2a2a2a; --soft:#141414; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#000000; --ink:#f2f2f2; --muted:#9a968f; --line:#2a2a2a; --soft:#141414; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,sans-serif;font-variation-settings:"wdth" 100;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{height:26px;width:auto;filter:invert(1)}
:root[data-theme="dark"] .brand img{filter:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand img{filter:none} }
.brand span{font-variation-settings:"wdth" 112;font-weight:600;font-size:14px;color:var(--muted)}
main{flex:1;display:grid;place-items:center;padding:12px 18px 40px}
.wrap{width:min(560px,100%);display:grid;gap:26px;justify-items:center;text-align:center}
.screen{width:min(420px,100%);background:var(--bezel);border-radius:22px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.lcd{position:relative;overflow:hidden;border-radius:10px;background:linear-gradient(170deg,var(--lcd1),var(--lcd2));color:var(--lcdInk);font-family:"Pixelify Sans",ui-monospace,monospace;text-align:left;padding:10px 14px 14px}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(20,70,196,.05) 0 1px,transparent 1px 3px);pointer-events:none}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;padding-bottom:6px;border-bottom:2px solid rgba(20,70,196,.35)}
.bar .bat{width:22px;height:11px;border:2px solid currentColor;border-radius:2px;position:relative}
.bar .bat::before{content:"";position:absolute;inset:1px;right:30%;background:currentColor}
.bar .bat::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:3px;background:currentColor}
.big{font-size:clamp(52px,16vw,84px);font-weight:700;line-height:1;margin:16px 0 4px}
.sub{font-size:18px;font-weight:600;margin:0 0 12px}
.rows{list-style:none;margin:0;padding:0;font-size:16px}
.rows li{display:flex;justify-content:space-between;gap:12px;padding:5px 8px;border:2px solid transparent;border-radius:3px}
.rows li.sel{border-color:currentColor}
.rows .r{color:var(--lcdDim)}
.rows a{color:inherit;text-decoration:none;display:flex;justify-content:space-between;width:100%;gap:12px}
.rows a:focus-visible{outline:2px solid var(--lcdInk);outline-offset:3px}
h1{font-size:clamp(26px,6vw,34px);font-variation-settings:"wdth" 112;font-weight:800;letter-spacing:-.01em;margin:0}
.lede{font-size:16px;line-height:1.55;color:var(--muted);margin:8px auto 0;max-width:46ch}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font:inherit;font-weight:600;font-size:15px;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-visible{outline:2px solid #2f6bff;outline-offset:3px}
footer{padding:18px 22px 22px;text-align:center;font-size:12px;color:var(--muted)}
footer a{color:inherit}
</style>
